services:
  postgres:
    image: pgvector/pgvector:pg17
    # Nombre de contenedor actualizado al rebrand, pero el volumen y las credenciales
    # de abajo (knowledgeos-pgdata, POSTGRES_USER/PASSWORD/DB) se dejan EXACTAMENTE
    # como estaban a propósito: son datos reales ya persistidos en ese volumen desde
    # antes del monorepo (packages/cerebro-memory). Renombrarlos aqui no migra los
    # datos - solo los deja huerfanos (Postgres/Docker no reconoceria el volumen
    # "nuevo" como el mismo, y un `docker compose up` crearia uno vacio).
    container_name: cerebro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledgeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: knowledgeos
    ports:
      # bind to localhost only - this database is not meant to be reachable from outside the host
      - "127.0.0.1:5432:5432"
    volumes:
      - knowledgeos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeos -d knowledgeos"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dockerized API (plan_v2.md SS10). Behind the `full` profile on purpose: plain
  # `docker compose up -d` (default, no --profile flag) still only starts postgres -
  # the day-to-day dev workflow (`python -m cerebro_memory.main` against it) is unchanged.
  # `docker compose --profile full up -d` starts BOTH: postgres + this container.
  api:
    build:
      context: ./packages/cerebro-memory
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
        EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
    image: cerebro-memory-api
    container_name: cerebro-memory-api
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the compose network postgres is reachable by service name, not
      # localhost (which .env points at for local, non-docker dev) - override it here
      # so the same .env works for both modes without editing it.
      DATABASE_URL: postgresql://knowledgeos:${POSTGRES_PASSWORD}@postgres:5432/knowledgeos
      # .env sets APP_PORT=8005 (the host-side port Caddy proxies to); inside the
      # container the app must listen on 8000, which is what the port mapping and
      # healthcheck below expect.
      APP_PORT: 8000
    ports:
      - "127.0.0.1:8005:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  knowledgeos-pgdata:
