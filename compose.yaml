services:
  postgres:
    image: pgvector/pgvector:pg17
    # Nombre de contenedor actualizado al rebrand, pero el volumen y las credenciales
    # de abajo (knowledgeos-pgdata, POSTGRES_USER/PASSWORD/DB) se dejan EXACTAMENTE
    # como estaban a propósito: son datos reales ya persistidos en ese volumen desde
    # antes del monorepo (packages/cerebro-memory). Renombrarlos aqui no migra los
    # datos - solo los deja huerfanos (Postgres/Docker no reconoceria el volumen
    # "nuevo" como el mismo, y un `docker compose up` crearia uno vacio).
    container_name: cerebro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledgeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: knowledgeos
    ports:
      # bind to localhost only - this database is not meant to be reachable from outside the host.
      # Host-side port parametrizado via POSTGRES_HOST_PORT (default 5432, igual que antes) -
      # en un host que ya tiene otro Postgres ocupando 5432 (ej. el servidor de pruebas
      # compartido 192.168.0.101, con su propio contenedor "pgdb" en ese puerto), basta con
      # poner POSTGRES_HOST_PORT=5433 (o el que este libre) en el .env de ESE servidor - el
      # puerto interno del contenedor (5432, el lado derecho) no cambia, y la DSN que usan
      # cerebro-memory-api/cerebro-docs-api tampoco (se conectan por nombre de servicio
      # "postgres" dentro de la red de compose, no por este puerto de host).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - knowledgeos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeos -d knowledgeos"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis (luisjdev-pendientes/cerebro-flows SS5): guarda SOLO el puntero mutable de
  # una ejecucion de flujo (flow_run:<run_id>), nunca la definicion completa -- por
  # eso basta con un solo nodo, sin cluster/replicas. Sin `profile`, igual que
  # postgres: arranca con el `docker compose up -d` de siempre, disponible tambien
  # para el dev local sin Docker de cerebro-flows-api (`python -m cerebro_flows.main`)
  # y para futuros modulos del ecosistema que necesiten estado rapido/efimero -- no
  # es exclusivo de flows, solo es su primer consumidor.
  redis:
    image: redis:7-alpine
    container_name: cerebro-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      # Host-side port parametrizado via REDIS_HOST_PORT (default 6379) - mismo
      # motivo que POSTGRES_HOST_PORT arriba.
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - cerebro-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dockerized API (plan_v2.md SS10). Behind the `full` profile on purpose: plain
  # `docker compose up -d` (default, no --profile flag) still only starts postgres -
  # the day-to-day dev workflow (`python -m cerebro_memory.main` against it) is unchanged.
  # `docker compose --profile full up -d` starts BOTH: postgres + this container.
  #
  # Service key renamed from `api` -> `cerebro-memory-api` (ecosistema-cerebro.md SS8)
  # to match container_name/image, now that a second API service (cerebro-docs-api,
  # below) shares this file. This is a service RENAME, not just an image rename: on
  # the VPS, `docker compose --profile full up -d` will see the old `api` service is
  # gone from the file and treat its existing container as an orphan - it keeps
  # running untouched unless you pass --remove-orphans. Update the VPS with
  # `docker compose --profile full up -d --remove-orphans` to actually remove it
  # (safe: it's stateless, postgres holds the data).
  cerebro-memory-api:
    build:
      context: ./packages/cerebro-memory
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
        EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
    image: cerebro-memory-api
    container_name: cerebro-memory-api
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the compose network postgres is reachable by service name, not
      # localhost (which .env points at for local, non-docker dev) - override it here
      # so the same .env works for both modes without editing it.
      DATABASE_URL: postgresql://knowledgeos:${POSTGRES_PASSWORD}@postgres:5432/knowledgeos
      # .env sets APP_PORT (host-side port Caddy proxies to, for local non-docker dev);
      # inside the container the app must listen on 8000, which is what the port
      # mapping and healthcheck below expect.
      APP_PORT: 8000
    ports:
      # Host-side port parametrizado via CEREBRO_MEMORY_HOST_PORT (default 8005, igual que
      # antes) - mismo motivo que POSTGRES_HOST_PORT arriba: el interno (8000) no cambia.
      - "127.0.0.1:${CEREBRO_MEMORY_HOST_PORT:-8005}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # cerebro-docs API (ecosistema-cerebro.md SS7/SS8): same Postgres instance as
  # cerebro-memory-api, separate schema (cerebro_docs), separate stateless container.
  # Mirrors cerebro-memory-api's pattern exactly (profile, healthcheck, depends_on).
  cerebro-docs-api:
    build:
      context: ./packages/cerebro-docs
    image: cerebro-docs-api
    container_name: cerebro-docs-api
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    # Shared .env: both services load the same file, but its APP_PORT/API_TOKEN were
    # written with cerebro-memory-api in mind. APP_PORT is overridden below to the
    # in-container port this service actually expects (config.py defaults app_port to
    # 8010, but we standardize the in-container port to 8000 for both services here,
    # same as cerebro-memory-api, so the healthcheck/port-mapping pattern matches
    # exactly). API_TOKEN is intentionally left shared: it's the root token for the
    # whole ecosystem (ecosistema-cerebro.md SS13) - named, scoped tokens are minted
    # per-service via `cerebro token create`, not this one.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://knowledgeos:${POSTGRES_PASSWORD}@postgres:5432/knowledgeos
      APP_PORT: 8000
    ports:
      # Host-side port parametrizado via CEREBRO_DOCS_HOST_PORT (default 8006, igual que
      # antes) - mismo motivo que POSTGRES_HOST_PORT arriba: el interno (8000) no cambia.
      - "127.0.0.1:${CEREBRO_DOCS_HOST_PORT:-8006}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # cerebro-flows API (luisjdev-pendientes/cerebro-flows): mismo Postgres compartido
  # (schema cerebro_flows) + Redis nuevo de arriba. Mismo patron exacto que
  # cerebro-memory-api/cerebro-docs-api (profile, healthcheck, depends_on) mas la
  # dependencia extra de redis.
  cerebro-flows-api:
    build:
      context: ./packages/cerebro-flows
    image: cerebro-flows-api
    container_name: cerebro-flows-api
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://knowledgeos:${POSTGRES_PASSWORD}@postgres:5432/knowledgeos
      REDIS_URL: redis://redis:6379/0
      APP_PORT: 8000
    ports:
      # Host-side port parametrizado via CEREBRO_FLOWS_HOST_PORT (default 8007,
      # siguiente libre despues de memory=8005/docs=8006) - mismo motivo que
      # POSTGRES_HOST_PORT arriba.
      - "127.0.0.1:${CEREBRO_FLOWS_HOST_PORT:-8007}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  knowledgeos-pgdata:
  cerebro-redis-data:
