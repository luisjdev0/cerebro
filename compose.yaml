services:
  postgres:
    image: pgvector/pgvector:pg17
    # Container name updated for the rebrand, but the volume and the credentials
    # below (knowledgeos-pgdata, POSTGRES_USER/PASSWORD/DB) are left EXACTLY as
    # they were on purpose: this is real data already persisted in that volume
    # from before the monorepo (packages/cerebro-memory). Renaming them here
    # doesn't migrate the data - it just orphans it (Postgres/Docker wouldn't
    # recognize the "new" volume as the same one, and a `docker compose up`
    # would create an empty one).
    container_name: cerebro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: knowledgeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD in .env}
      POSTGRES_DB: knowledgeos
    ports:
      # bind to localhost only - this database is not meant to be reachable from outside the host.
      # Host-side port made configurable via POSTGRES_HOST_PORT (default 5432, same as before) -
      # on a host that already has another Postgres occupying 5432 (e.g. the
      # shared test server 192.168.0.101, with its own "pgdb" container on that
      # port), it's enough to set POSTGRES_HOST_PORT=5433 (or whatever's free) in
      # THAT server's .env - the container's internal port (5432, the right-hand
      # side) doesn't change, and neither does the DSN that cerebro-memory-api/
      # cerebro-docs-api use (they connect by the "postgres" service name within
      # the compose network, not by this host port).
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - knowledgeos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowledgeos -d knowledgeos"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis (luisjdev-pendientes/cerebro-flows SS5): stores ONLY the mutable
  # pointer of a flow run (flow_run:<run_id>), never the full definition -- so
  # a single node is enough, no cluster/replicas needed. No `profile`, same as
  # postgres: starts with the usual `docker compose up -d`, also available for
  # local dev of cerebro-flows-api outside Docker (`python -m cerebro_flows.main`)
  # and for future ecosystem modules that need fast/ephemeral state -- it's not
  # exclusive to flows, just its first consumer.
  redis:
    image: redis:7-alpine
    container_name: cerebro-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      # Host-side port made configurable via REDIS_HOST_PORT (default 6379) - same
      # reason as POSTGRES_HOST_PORT above.
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - cerebro-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dockerized API (plan_v2.md SS10). Behind the `full` profile on purpose: plain
  # `docker compose up -d` (default, no --profile flag) still only starts postgres -
  # the day-to-day dev workflow (`python -m cerebro_memory.main` against it) is unchanged.
  # `docker compose --profile full up -d` starts BOTH: postgres + this container.
  #
  # Service key renamed from `api` -> `cerebro-memory-api` (ecosistema-cerebro.md SS8)
  # to match container_name/image, now that a second API service (cerebro-docs-api,
  # below) shares this file. This is a service RENAME, not just an image rename: on
  # the VPS, `docker compose --profile full up -d` will see the old `api` service is
  # gone from the file and treat its existing container as an orphan - it keeps
  # running untouched unless you pass --remove-orphans. Update the VPS with
  # `docker compose --profile full up -d --remove-orphans` to actually remove it
  # (safe: it's stateless, postgres holds the data).
  cerebro-memory-api:
    build:
      context: ./packages/cerebro-memory
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
        EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
    image: cerebro-memory-api
    container_name: cerebro-memory-api
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Inside the compose network postgres is reachable by service name, not
      # localhost (which .env points at for local, non-docker dev) - override it here
      # so the same .env works for both modes without editing it.
      DATABASE_URL: postgresql://knowledgeos:${POSTGRES_PASSWORD}@postgres:5432/knowledgeos
      # .env sets APP_PORT (host-side port Caddy proxies to, for local non-docker dev);
      # inside the container the app must listen on 8000, which is what the port
      # mapping and healthcheck below expect.
      APP_PORT: 8000
    ports:
      # Host-side port made configurable via CEREBRO_MEMORY_HOST_PORT (default 8005, same as
      # before) - same reason as POSTGRES_HOST_PORT above: the internal one (8000) doesn't change.
      - "127.0.0.1:${CEREBRO_MEMORY_HOST_PORT:-8005}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # cerebro-docs API (ecosistema-cerebro.md SS7/SS8): same Postgres instance as
  # cerebro-memory-api, separate schema (cerebro_docs), separate stateless container.
  # Mirrors cerebro-memory-api's pattern exactly (profile, healthcheck, depends_on).
  cerebro-docs-api:
    build:
      context: ./packages/cerebro-docs
    image: cerebro-docs-api
    container_name: cerebro-docs-api
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    # Shared .env: both services load the same file, but its APP_PORT/API_TOKEN were
    # written with cerebro-memory-api in mind. APP_PORT is overridden below to the
    # in-container port this service actually expects (config.py defaults app_port to
    # 8010, but we standardize the in-container port to 8000 for both services here,
    # same as cerebro-memory-api, so the healthcheck/port-mapping pattern matches
    # exactly). API_TOKEN is intentionally left shared: it's the root token for the
    # whole ecosystem (ecosistema-cerebro.md SS13) - named, scoped tokens are minted
    # per-service via `cerebro token create`, not this one.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://knowledgeos:${POSTGRES_PASSWORD}@postgres:5432/knowledgeos
      APP_PORT: 8000
    ports:
      # Host-side port made configurable via CEREBRO_DOCS_HOST_PORT (default 8006, same as
      # before) - same reason as POSTGRES_HOST_PORT above: the internal one (8000) doesn't change.
      - "127.0.0.1:${CEREBRO_DOCS_HOST_PORT:-8006}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # cerebro-flows API (luisjdev-pendientes/cerebro-flows): same shared Postgres
  # (cerebro_flows schema) + the new Redis above. Exact same pattern as
  # cerebro-memory-api/cerebro-docs-api (profile, healthcheck, depends_on) plus
  # the extra redis dependency.
  cerebro-flows-api:
    build:
      context: ./packages/cerebro-flows
    image: cerebro-flows-api
    container_name: cerebro-flows-api
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://knowledgeos:${POSTGRES_PASSWORD}@postgres:5432/knowledgeos
      REDIS_URL: redis://redis:6379/0
      APP_PORT: 8000
    ports:
      # Host-side port made configurable via CEREBRO_FLOWS_HOST_PORT (default 8007,
      # next free one after memory=8005/docs=8006) - same reason as
      # POSTGRES_HOST_PORT above.
      - "127.0.0.1:${CEREBRO_FLOWS_HOST_PORT:-8007}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Internal gateway (requested by Jose Luis, 2026-09-23): routes /memory, /docs,
  # /flows by prefix to each API and exposes A SINGLE port, so an EXTERNAL Caddy
  # (whoever's VPS deploys this) only needs one simple reverse_proxy to this
  # port, instead of one block per service -- see gateway/Caddyfile for routing
  # detail. Full profile (same as the APIs it fronts); doesn't replace each
  # API's direct ports (memory/docs/flows-api stay there for local dev or direct
  # access within the compose network), it's an additional, optional layer.
  gateway:
    image: caddy:2-alpine
    container_name: cerebro-gateway
    restart: unless-stopped
    profiles: ["full"]
    depends_on:
      cerebro-memory-api:
        condition: service_healthy
      cerebro-docs-api:
        condition: service_healthy
      cerebro-flows-api:
        condition: service_healthy
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      # Host-side port made configurable via CEREBRO_GATEWAY_HOST_PORT (default
      # 8080) - same reason as POSTGRES_HOST_PORT above.
      - "127.0.0.1:${CEREBRO_GATEWAY_HOST_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  knowledgeos-pgdata:
  cerebro-redis-data:
