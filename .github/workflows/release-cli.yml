# Builds and publishes standalone `cerebro` CLI binaries to a GitHub Release.
#
# This is the first GitHub Actions workflow in the repo -- deliberately scoped
# to just this (no general test/lint CI here, that's a separate concern for a
# separate workflow if it's ever added). See
# `luisjdev-pendientes/ecosistema-cerebro` §"CLI (cerebro-cli)" for the design
# this implements: a generic, no-secrets-embedded binary per platform, fetched
# straight from Releases at install time by gateway/install/install.sh|ps1.
#
# macOS is intentionally out of scope (see the same pendientes doc).
name: Release CLI

# Triggers:
#  * push to main touching CHANGELOG.md -> the newest `## [X.Y.Z]` heading is the
#    version; if that release does not exist yet it is built and published (the tag
#    is created by the release step itself). Merging a PR that bumps the CHANGELOG is
#    therefore all it takes -- no manual tagging.
#  * push of a `v*` tag -> same build, for that tag (manual escape hatch).
#  * workflow_dispatch -> same as the main push, to retry a failed release.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            ver=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            tag="v${ver}"
          fi
          if [[ "$GITHUB_REF" != refs/tags/v* ]] && gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: cerebro-linux-amd64
            build_name: cerebro
          - os: windows-latest
            asset_name: cerebro-windows-amd64.exe
            build_name: cerebro.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Install order matters: cerebro-cli depends on cerebro-clients and
      # cerebro-memory (both local packages, not on PyPI) -- same order as
      # README.md's dev setup instructions.
      - name: Install cerebro-cli and its local dependencies
        run: |
          pip install ./packages/cerebro-clients ./packages/cerebro-memory ./packages/cerebro-cli pyinstaller

      - name: Build binary with PyInstaller
        working-directory: packages/cerebro-cli
        run: |
          pyinstaller --onefile --name cerebro --distpath dist src/cerebro_cli/main.py

      - name: Rename build output to its release asset name
        shell: bash
        run: |
          mv "packages/cerebro-cli/dist/${{ matrix.build_name }}" "${{ matrix.asset_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release with both binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/cerebro-linux-amd64
            dist/cerebro-windows-amd64.exe
