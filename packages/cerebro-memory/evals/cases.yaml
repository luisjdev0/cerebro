# Casos de evaluación de retrieval para KnowledgeOS.
#
# Se ejecutan contra el corpus de evals/memories.yaml. Cada caso define una query en
# español, el conjunto de memorias que deberían aparecer en el top-5 (memorias_relevantes),
# y el conjunto de memorias "trampa" que NO deberían aparecer porque pertenecen a un
# contexto distinto al de la query (memorias_trampa). El harness calcula precision@5,
# recall@5 y si alguna memoria trampa contaminó el top-5.
#
# Categorías:
#   directo   - una sola memoria relevante, sin ambigüedad de vocabulario. memorias_trampa
#               suele ir vacío.
#   ambiguo   - la query comparte vocabulario con memorias de >=2 contextos distintos.
#               memorias_trampa lista esas memorias de contexto equivocado.
#   temporal  - la respuesta correcta es la memoria activa vigente; la versión
#               "superseded" del mismo hecho es la trampa.

cases:
  # =======================================================================
  # DIRECTOS (12)
  # =======================================================================
  - id: d-001
    categoria: directo
    query: "¿Qué stack tecnológico usa el proyecto Expense Tracker?"
    memorias_relevantes: [et-stack-tecnologico]
    memorias_trampa: []
    contexto_esperado: expense-tracker

  - id: d-002
    categoria: directo
    query: "¿Cuál es mi rutina de ejercicio actual?"
    memorias_relevantes: [sa-rutina-ejercicio]
    memorias_trampa: []
    contexto_esperado: salud

  - id: d-003
    categoria: directo
    query: "¿A qué medicamento soy alérgico?"
    memorias_relevantes: [sa-alergia-medicamento]
    memorias_trampa: []
    contexto_esperado: salud

  - id: d-004
    categoria: directo
    query: "¿En qué proveedor está alojado mi VPS personal?"
    memorias_relevantes: [inf-vps-proveedor]
    memorias_trampa: []
    contexto_esperado: infraestructura

  - id: d-005
    categoria: directo
    query: "¿Qué curso estoy tomando en Udemy?"
