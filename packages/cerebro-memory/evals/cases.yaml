    query: "¿Qué alcance cubre el contrato firmado con Acme?"
    memorias_relevantes: [ca-contrato-alcance]
    memorias_trampa: []
    contexto_esperado: cliente-acme

  - id: d-008
    categoria: directo
    query: "¿Cuál es mi meta de ahorro para 2026?"
    memorias_relevantes: [fp-ahorro-meta]
    memorias_trampa: []
    contexto_esperado: finanzas-personales

  - id: d-009
    categoria: directo
    query: "¿Qué libro sobre sistemas distribuidos terminé de leer?"
    memorias_relevantes: [ap-libro-diseno-sistemas]
