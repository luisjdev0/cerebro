    contexto_esperado: aprendizaje

  - id: d-010
    categoria: directo
    query: "¿Qué pasó con el VPS el 5 de julio?"
    memorias_relevantes: [inf-incidente-caida]
    memorias_trampa: []
    contexto_esperado: infraestructura

  - id: d-011
    categoria: directo
    query: "¿Qué bug de Expense Tracker corregí el 12 de julio?"
    memorias_relevantes: [et-bug-calculo-total]
    memorias_trampa: []
    contexto_esperado: expense-tracker

  - id: d-012
    categoria: directo
    query: "¿Qué acordamos en la reunión de kickoff con Acme?"
    memorias_relevantes: [ca-reunion-kickoff]
    memorias_trampa: []
    contexto_esperado: cliente-acme

  # =======================================================================
  # AMBIGUOS (12) — colisión de vocabulario entre contextos
  # =======================================================================
  - id: amb-001
    categoria: ambiguo
    query: "¿Cuánto gasté este mes?"
