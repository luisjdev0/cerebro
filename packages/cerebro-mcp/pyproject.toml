[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebro-mcp"
version = "0.1.0"
description = "cerebro-mcp - servidor MCP stdio unico del ecosistema cerebro (memory_* + docs_*)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27",
    "cerebro-clients",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
cerebro-mcp = "cerebro_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
