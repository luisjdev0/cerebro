[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebro-docs"
version = "0.1.0"
description = "cerebro-docs - repository of complete, categorizable, versioned Markdown documents (part of the cerebro ecosystem)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # so tests can apply the shared `cerebro_auth` schema to the ephemeral test
    # database before this package's own migrations/tests run - see
    # tests/conftest.py. Only a dev/test dependency: at runtime this service only
    # ever READS cerebro_auth's tables via a schema-qualified query (auth.py),
    # it never imports the package itself.
    "cerebro-auth",
]

[project.scripts]
cerebro-docs = "cerebro_docs.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
